# Paramètres du banc B1 — l'IMU jusqu'à ROS.
#
# Les valeurs marquées 📐 sont des ordres de grandeur posés faute de mesure.
# Elles ne sont PAS des spécifications, et la recette du banc dit comment les
# remplacer par des mesures. Une covariance inventée qui traîne trois mois est
# une dette qui se paie au moment où l'EKF se met à dériver sans raison.

/retriever_link_bridge:
  ros__parameters:

    transport: "serial"
    serial:
      device: "/dev/ttyUSB0"
      baudrate: 921600

    can:
      interface: "can0"

    # Repère du capteur. Le placement de ce repère par rapport au robot est
    # décrit dans l'URDF, jamais ici.
    frame_id: "imu_link"

    link:
      # 📐 À REMPLACER par la mesure : lancer le nœud, lire round_trip_ms dans
      # /retriever/link_status pendant une minute, prendre la médiane, diviser
      # par deux. L'aller simple est ce qu'il faut retrancher à l'horodatage.
      latency_offset_ms: 1.5
      ping_period_s: 1.0
      time_sync: true

    imu:
      expected_rate_hz: 100.0

      # ✅ Datasheet BNO08x : erreur dynamique 3,5°, statique 2,0°.
      # 3,5° = 0,0611 rad.
      orientation_stddev_rp: 0.0611

      # ✅ §I.2 du dossier : « en pratique typiquement 5° ». On ne croit pas le
      # capteur en dessous de cette valeur, même quand il s'annonce meilleur.
      orientation_stddev_yaw_min: 0.0873

      # 📐 Lacet quand le capteur n'en fournit pas d'estimation — game rotation
      # vector. 1 rad ≈ 57° : autant dire inconnu, ce qui est exactement le
      # message à faire passer à l'EKF.
      orientation_stddev_yaw_unreported: 1.0

      # 📐 À REMPLACER par la mesure : robot immobile, 60 s d'enregistrement,
      # écart type de chaque axe. Procédure dans la recette B1.
      angular_velocity_stddev: 0.01
      linear_acceleration_stddev: 0.1
      magnetic_field_stddev: 2.0e-6

      use_reported_accuracy: true

    # ⚠️ Aides de banc UNIQUEMENT. Sur le robot, c'est l'EKF qui publie les
    # transformations : laisser ceci actif donnerait deux sources sur la même
    # arête de l'arbre TF, ce qui est la faute décrite au §I.3.
    bench:
      publish_tf: true
      tf_parent: "imu_world"
      publish_marker: true
