# Paramètres du YDLIDAR X4 — banc.
#
# ⚠️ Ce fichier a été établi PAR LA MESURE, pas d'après la documentation, et les
# deux ne sont pas d'accord. La table par modèle du constructeur donne pour le
# X4 un capteur double canal (`isSingleChannel: false`). L'exemplaire du banc
# — série 2021090300040777, firmware 1.10, code modèle 6 — répond au dialogue
# de configuration comme un double canal (il livre ses informations produit)
# mais ne délivre ses SCANS qu'en mono-canal. Avec false : « Operation timed
# out » à l'infini. Avec true : les scans arrivent.
#
# Méthode qui a fini par marcher, après une après-midi d'hypothèses : reproduire
# à l'identique `tri_test`, le programme d'exemple du SDK qui fonctionnait, puis
# s'en écarter un paramètre à la fois. Chaque valeur ci-dessous porte sa
# provenance :
#   ✅ prouvée au banc, dans la configuration qui marche
#   📐 écart volontaire par rapport à cette configuration, inoffensif par nature
#   🔴 à trancher par une mesure physique — voir docs/DEMARRAGE.md §4 ter
#
# ⚠️ La clé de premier niveau DOIT être le nom du nœud tel qu'il est lancé.
# Un nœud renommé lit ses valeurs par défaut — celles d'un AUTRE modèle de
# lidar — et démarre quand même. Le fichier de lancement force le nom.

ydlidar_ros2_driver_node:
  ros__parameters:

    port: /dev/ydlidar            # alias udev ; sans lui, ttyUSB0 ou 1 selon l'ordre de branchement
    baudrate: 128000              # ✅
    frame_id: laser               # ✅ §03 du dossier

    lidar_type: 1                 # ✅ TYPE_TRIANGLE
    device_type: 0                # ✅ YDLIDAR_TYPE_SERIAL

    # ✅ true — contraire à la documentation, voir l'en-tête. Conséquence à
    # connaître : le journal affiche « Fail to get baseplate device information »
    # au démarrage. Ce n'est PAS une panne, c'est le prix du mono-canal.
    isSingleChannel: true

    # ✅ true. ⚠️ Une version précédente de ce fichier affirmait false comme un
    # fait établi : le moteur ne démarrait pas avec true. Mais à ce moment-là
    # isSingleChannel était encore à false, les deux avaient changé ensemble,
    # et le résultat avait été attribué au mauvais paramètre. C'est exactement
    # l'erreur que la règle « un paramètre à la fois » existe pour éviter.
    support_motor_dtr: true

    # ✅ intensity_bit à 10 n'est pas une largeur : c'est « je ne sais pas,
    # cherche ». C'est ce qui déclenche le sondage 16 → 8 → 0 visible au
    # démarrage, avec ses erreurs de somme de contrôle — elles sont NORMALES,
    # c'est le SDK qui essaie les largeurs une à une. À 0, il ne cherche pas,
    # ne resynchronise jamais le flux, et attend des trames qui n'arrivent
    # jamais. Le X4 ne fournit pas d'intensité : le sondage aboutit à 0.
    intensity: false
    intensity_bit: 10

    sample_rate: 5                # ✅ 5 kHz — le pilote ROS met 9 par défaut, ce qui casse tout

    # ✅ 5,0 est la valeur de la configuration qui marche. Elle est NOMINALE : en
    # mono-canal le moteur n'est pas asservi, il tourne à sa vitesse libre —
    # 670 points à 5 kHz, soit ~7,5 Hz, mesuré — et le pilote calcule la durée
    # réelle de chaque tour d'après ses horodatages, pas d'après ce nombre.
    frequency: 5.0

    fixed_resolution: false       # ✅ — le nombre de points par tour varie de quelques unités
    abnormal_check_count: 4       # ✅
    auto_reconnect: true          # ✅

    # 🔴 false / false est la configuration qui marche, mais ces deux-là ne
    # changent rien à l'acquisition : ils retournent ou miroitent le scan. Ils
    # ne se vérifient PAS sur le papier — un objet à 1 m droit devant, et on
    # regarde où il apparaît. Une erreur ici donne une carte plausible et un
    # robot qui tourne du mauvais côté. Procédure dans DEMARRAGE.md §4 ter.
    reversion: false
    inverted: false

    angle_min: -180.0
    angle_max: 180.0
    # 📐 La configuration qui marche disait 0,05 et 64 — les valeurs génériques
    # de tri_test. Celles-ci sont la fiche technique du X4. Elles ne font que
    # borner les mesures publiées : elles ne peuvent pas empêcher l'acquisition.
    range_min: 0.12
    range_max: 10.0

    # ✅ REP-117 : une mesure hors portée se dit +inf, pas 0.0. Réglage côté
    # ROS uniquement, le SDK ne le voit pas.
    invalid_range_is_inf: true

    ignore_array: ""              # secteurs masqués une fois monté sur le châssis
    debug: false
